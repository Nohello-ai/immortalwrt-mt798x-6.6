name: build-openfi6c
#
# OpenFi 6C 固件：ImmortalWrt-mt798x 6.6（闭源 MT WiFi + HNAT）+ OpenFi 适配
#
# 缓存三层（GitHub 每仓库上限 10 GB）：
#   dl/                     ~1.5 GB  源码包，省掉重复下载
#   staging_dir + toolchain ~3   GB  省掉重建工具链（约 40 分钟）
#   .ccache                 ~3   GB  编译产物缓存（大头）
#
# 「带上 LuCI 包」开关（workflow_dispatch 的 with_packages）：
#   打开 → 把同账号下的 openfi6c-packages 仓库挂成 feed 并编进固件
#          （风扇/状态灯管理 + 5G 模组信息，含静默模式开关与连通性检测）
#   关闭 → 只出裸固件
#   push / schedule 触发没有这个输入，默认按「打开」处理。
#
# 成功后在 Releases 里出**两个**文件：固件本体 + 它的 MD5 文本。

on:
  workflow_dispatch:
    inputs:
      with_packages:
        description: '把 openfi6c-packages 的 LuCI 包一起编进固件'
        type: boolean
        default: true
      publish:
        description: '编译成功后创建版本发布'
        type: boolean
        default: true
  push:
    branches: [openfi6c]
    paths:
      - 'defconfig/**'
      - 'target/linux/mediatek/dts/mt7981b-openfi-6c.dts'
      - 'target/linux/mediatek/image/filogic.mk'
      - 'target/linux/mediatek/filogic/base-files/**'
      - '.github/workflows/build.yml'
  schedule:
    - cron: '0 18 * * 0'

concurrency:
  group: build-openfi6c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译 OpenFi 6C
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - name: 生成版本号（按时间）
        id: ver
        run: |
          TAG="v25.12-openfi6c-$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "版本号: $TAG"

      # 按钮只在 workflow_dispatch 时存在；push / schedule 没有 inputs，
      # 这里统一成一个明确的 true/false，后面的步骤都用它判断。
      - name: 决定是否带 LuCI 包
        id: opt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ inputs.with_packages }}"
          else
            v="true"
          fi
          case "$v" in true) v=true ;; *) v=false ;; esac
          echo "with_packages=$v" >> "$GITHUB_OUTPUT"
          echo "把 openfi6c-packages 编进固件: $v"

      - name: 取出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 释放磁盘空间
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /opt/google/chrome /usr/share/swift "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev libelf-dev zlib1g-dev \
            python3 python3-dev python3-setuptools python3-pyelftools python3-ply \
            rsync unzip file wget curl ca-certificates subversion swig cmake \
            ninja-build autoconf automake libtool pkgconf ccache help2man patch \
            time xsltproc zstd liblz4-tool libzstd-dev device-tree-compiler lua5.1

      # ---------------- 编译缓存：三层 ----------------
      - name: 缓存 dl/（源码包）
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-25.12-${{ hashFiles('feeds.conf.default') }}
          restore-keys: |
            dl-25.12-

      - name: 缓存 staging_dir + toolchain（省掉重建工具链）
        uses: actions/cache@v4
        with:
          path: |
            staging_dir
            toolchain
          key: staging-25.12-${{ runner.arch }}-${{ hashFiles('defconfig/openfi6c.config') }}
          restore-keys: |
            staging-25.12-

      - name: ccache 配置
        run: |
          # OpenWrt 的 rules.mk 会用 CONFIG_CCACHE_DIR（默认 $(TOPDIR)/.ccache）覆盖环境变量，
          # 所以缓存路径是仓库根下的 .ccache。前提是 .config 里有 CONFIG_CCACHE=y。
          echo "CCACHE_COMPILERCHECK=content" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV
          echo "CCACHE_BASEDIR=${{ github.workspace }}" >> $GITHUB_ENV
          mkdir -p .ccache

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-25.12-${{ github.sha }}
          restore-keys: |
            ccache-25.12-

      # ---------------- 构建 ----------------
      - name: 加入 openfi6c-packages feed（按开关）
        if: steps.opt.outputs.with_packages == 'true'
        run: |
          set -eu
          echo "src-git openfi6c https://github.com/${{ github.repository_owner }}/openfi6c-packages.git" >> feeds.conf.default
          echo "----- feeds.conf.default -----"
          cat feeds.conf.default

      - name: 更新并安装 feeds
        id: feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          if [ "${{ steps.opt.outputs.with_packages }}" = "true" ]; then
            C=$(git -C feeds/openfi6c rev-parse --short HEAD 2>/dev/null || echo "?")
            echo "pkg_commit=$C" >> "$GITHUB_OUTPUT"
            echo "----- openfi6c feed 实际拉到的提交 -----"
            git -C feeds/openfi6c log -1 --format='%H %ad %s' --date=short 2>/dev/null || true
          else
            echo "pkg_commit=" >> "$GITHUB_OUTPUT"
          fi

      - name: 应用配置
        run: |
          cp defconfig/openfi6c.config .config
          if [ "${{ steps.opt.outputs.with_packages }}" = "true" ]; then
            cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-app-openfi-fan=y
          CONFIG_PACKAGE_luci-app-openfi-modem=y
          EOF
          fi
          make defconfig
          echo "----- 关键配置确认 -----"
          grep -E 'CONFIG_TARGET_mediatek_filogic_DEVICE_openfi_6c=|CONFIG_PACKAGE_kmod-mt_wifi=|CONFIG_PACKAGE_kmod-warp=|CONFIG_PACKAGE_kmod-mediatek_hnat=|CONFIG_PACKAGE_mtwifi-cfg=' .config || true
          if [ "${{ steps.opt.outputs.with_packages }}" = "true" ]; then
            echo "----- 断言两个 LuCI 包真的被选中 -----"
            for s in luci-app-openfi-fan luci-app-openfi-modem; do
              grep -q "^CONFIG_PACKAGE_${s}=y" .config || { echo "::error::${s} 没进 .config（feed 没挂上或包名写错）"; exit 1; }
              echo "OK: ${s}=y"
            done
          fi
          echo "----- 断言 ccache 真的开了 -----"
          grep -q '^CONFIG_CCACHE=y' .config || { echo "::error::CONFIG_CCACHE 没生效，缓存形同虚设"; exit 1; }
          echo "OK: CONFIG_CCACHE=y"

      - name: 下载源码包
        run: |
          make download -j"$(nproc)" || make download -j1 V=s

      - name: 编译
        id: compile
        run: |
          set -o pipefail
          time make -j"$(nproc)" 2>&1 | tee /tmp/build.log

      - name: 编译失败诊断
        if: failure() && steps.compile.outcome == 'failure'
        run: |
          echo "===================== 错误行 ====================="
          grep -nE '(Error [0-9]+|error:|ERROR:|undefined reference|No rule to make target|fatal error|Hunk #.*FAILED|patch.*failed)' \
            /tmp/build.log | tail -n 60 || true
          echo ""
          echo "===================== 日志最后 200 行 ====================="
          tail -n 200 /tmp/build.log || true

      - name: ccache 命中统计
        if: always()
        run: |
          staging_dir/host/bin/ccache -s 2>/dev/null || ccache -s 2>/dev/null || echo "（首次构建，ccache 还没生成）"
          du -sh .ccache dl staging_dir 2>/dev/null || true

      - name: 收集产物 + 生成 MD5
        if: success()
        run: |
          set -eu
          mkdir -p out
          FW=$(find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*openfi_6c*sysupgrade.bin' | head -1)
          [ -n "$FW" ] || { echo "::error::没找到 sysupgrade 固件"; ls -la bin/targets/mediatek/filogic/ || true; exit 1; }
          cp "$FW" out/
          B=$(basename "$FW")
          ( cd out && md5sum "$B" > "$B.md5.txt" )
          echo "----- 产物 -----"
          ls -lh out/
          echo "----- MD5 -----"
          cat out/*.md5.txt

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ steps.ver.outputs.tag }}
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传固件
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openfi6c-${{ steps.ver.outputs.tag }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: 创建版本发布（固件 + MD5 两个文件）
        if: success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            TAG="${TAG}-$(git rev-parse --short HEAD)"
          fi
          FWNAME=$(cd out && ls | grep sysupgrade | head -1)
          if [ "${{ steps.opt.outputs.with_packages }}" = "true" ]; then
            PKG_ROW="**已内置** \`luci-app-openfi-fan\` + \`luci-app-openfi-modem\` @ \`${{ steps.feeds.outputs.pkg_commit }}\`"
            FAN_ROW='由 `luci-app-openfi-fan` 管理：四点温度曲线 + 四盏状态灯；物理开关切「静默模式」（风扇停转 + 四灯全灭，含过热保护）'
          else
            PKG_ROW='未内置（可在 Actions 里手动运行本工作流，把 `with_packages` 打开）'
            FAN_ROW='本版**不含**管理（pwm-fan 已 disabled，无人态脚本；按反极性等效全速常转）'
          fi
          cat > /tmp/notes.md <<NOTES
          ## OpenFi 6C 固件 $TAG

          | 项目 | 值 |
          |---|---|
          | 底座 | \`padavanonly/immortalwrt-mt798x-6.6\` @ \`openwrt-24.10-6.6\`（内核 6.6） |
          | WiFi | 联发科闭源 \`mt_wifi\` + WARP + HNAT（HNAT 已绑定 LAN=eth1 / PPD=eth1） |
          | WAN | USB 模组（RNDIS → \`usb0\`）自动成为 WAN，模组自己拨号 |
          | 风扇/LED | $FAN_ROW |
          | LuCI 包 | $PKG_ROW |

          ### 刷机

          \`\`\`sh
          sysupgrade -n /tmp/$FWNAME
          \`\`\`

          - 默认 LAN **\`192.168.6.1\`**（不是原厂的 192.168.21.1，也不是常见的 192.168.1.1）
          - root 无密码；WiFi 默认不加密（首次启动自动生成）
          - 从原厂固件刷入时**不要保留配置**

          ### 附件

          1. \`$FWNAME\` —— 固件本体
          2. \`$FWNAME.md5.txt\` —— 它的 MD5
          NOTES
          gh release create "$TAG" out/* \
            --title "OpenFi 6C $TAG" \
            --notes-file /tmp/notes.md \
            --repo "$GITHUB_REPOSITORY"
          echo "✅ Release: $TAG"
