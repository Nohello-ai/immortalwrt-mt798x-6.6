name: build-openfi6c
#
# OpenFi 6C 固件：ImmortalWrt-mt798x 6.6（闭源 MT WiFi + HNAT）+ OpenFi 适配
#
# 缓存三层（GitHub 每仓库上限 10 GB）：
#   dl/                     ~1.5 GB  源码包，省掉重复下载
#   staging_dir + toolchain ~3   GB  省掉重建工具链（约 40 分钟）
#   .ccache                 ~3   GB  编译产物缓存（大头）
#
# 「带上 LuCI 包」开关（workflow_dispatch 的 with_packages）：
#   打开 → 把同账号下的 openfi6c-packages 仓库挂成 feed 并编进固件
#          （风扇/状态灯管理 + 5G 模组信息，含静默模式开关与连通性检测）
#   关闭 → 只出裸固件
#   push / schedule 触发没有这个输入，默认按「打开」处理。
#
# 成功后在 Releases 里出**两个**文件：固件本体 + 它的 MD5 文本。

on:
  workflow_dispatch:
    inputs:
      with_packages:
        description: '把 openfi6c-packages 的 LuCI 包一起编进固件'
        type: boolean
        default: true
      publish:
        description: '编译成功后创建版本发布'
        type: boolean
        default: true
  push:
    branches: [openfi6c]
    paths:
      - 'defconfig/**'
      - 'target/linux/mediatek/dts/mt7981b-openfi-6c.dts'
      - 'target/linux/mediatek/image/filogic.mk'
      - 'target/linux/mediatek/filogic/base-files/**'
      - '.github/workflows/build.yml'
  schedule:
    - cron: '0 18 * * 0'

concurrency:
  group: build-openfi6c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译 OpenFi 6C
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - name: 生成版本号（按时间）
        id: ver
        run: |
          TAG="v25.12-openfi6c-$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "版本号: $TAG"

      # 按钮只在 workflow_dispatch 时存在；push / schedule 没有 inputs，
      # 这里统一成一个明确的 true/false，后面的步骤都用它判断。
      - name: 决定是否带 LuCI 包
        id: opt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ inputs.with_packages }}"
          else
            v="true"
          fi
          case "$v" in true) v=true ;; *) v=false ;; esac
          echo "with_packages=$v" >> "$GITHUB_OUTPUT"
          echo "把 openfi6c-packages 编进固件: $v"

      - name: 取出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 固件自带的脚本也要有回归测试。这个测试不碰硬件，一两秒跑完，
      # 但能挡住"改错模式映射/探测顺序"这类会让设备没网的改动。
      - name: 自检（USB 模式探测脚本）
        run: sh tests/test-usbmode.sh

      - name: 释放磁盘空间
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /opt/google/chrome /usr/share/swift "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev libelf-dev zlib1g-dev \
            python3 python3-dev python3-setuptools python3-pyelftools python3-ply \
            rsync unzip file wget curl ca-certificates subversion swig cmake \
            ninja-build autoconf automake libtool pkgconf ccache help2man patch \
            time xsltproc zstd liblz4-tool libzstd-dev device-tree-compiler lua5.1

      # ---------------- 编译缓存：三层 ----------------
      - name: 缓存 dl/（源码包）
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-25.12-${{ hashFiles('feeds.conf.default') }}
          restore-keys: |
            dl-25.12-

      - name: 缓存 staging_dir + toolchain（省掉重建工具链）
        uses: actions/cache@v4
        with:
          path: |
            staging_dir
            toolchain
          # 【提速关键】这里【故意不用】defconfig 的哈希做 key。
          # 工具链和 staging_dir 只跟「内核版本 / 工具链版本 / feed 列表」有关，
          # 跟「选了哪些包」没关系。之前把 defconfig 哈希写进 key，
          # 导致每次动一下 defconfig（比如这次 argon→aurora）就缓存全失效、
          # 白重建 10~15 分钟工具链。改成下面这几个真正相关的文件。
          # 注意：staging_dir 里少东西是安全的 —— 每个包的 .built 标记在
          # build_dir（不缓存）里，缺的包会自动重编并重新装进 staging_dir。
          key: staging-25.12-${{ runner.arch }}-${{ hashFiles('include/kernel-version.mk', 'feeds.conf.default', 'toolchain/gcc/Config.version') }}
          restore-keys: |
            staging-25.12-

      - name: 缓存内核编译目录（省掉每次重编内核）
        uses: actions/cache@v4
        with:
          # 【提速】staging 缓存只覆盖工具链，内核每次都要重编（实测 8~15 分钟）。
          # 这里单独缓存内核的 build_dir。缓存配额实测只用了 3GB / 10GB，放得下。
          # key 里带 kernel-version.mk：内核版本一变就自动失效，不会拿到错的内核。
          path: build_dir/target-*/linux-mediatek_filogic
          key: kernel-25.12-${{ runner.arch }}-${{ hashFiles('include/kernel-version.mk', 'target/linux/mediatek/Makefile', 'target/linux/mediatek/filogic/config-6.6') }}
          restore-keys: |
            kernel-25.12-${{ runner.arch }}-

      - name: ccache 配置
        run: |
          # OpenWrt 的 rules.mk 会用 CONFIG_CCACHE_DIR（默认 $(TOPDIR)/.ccache）覆盖环境变量，
          # 所以缓存路径是仓库根下的 .ccache。前提是 .config 里有 CONFIG_CCACHE=y。
          echo "CCACHE_COMPILERCHECK=content" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV
          echo "CCACHE_BASEDIR=${{ github.workspace }}" >> $GITHUB_ENV
          # 【提速】每次 CI 都是全新 clone 的文件，mtime/ctime 全变了，
          # ccache 默认会因为这些时间戳把缓存判为失效 —— 白丢命中率。
          # 允许它忽略这些跟内容无关的因素，命中率明显上升。
          echo "CCACHE_SLOPPINESS=time_macros,include_file_ctime,include_file_mtime,file_stat_matches" >> $GITHUB_ENV
          # 压缩后同样 3G 能装下更多条目（CPU 开销换空间，在 4 核 runner 上划算）。
          echo "CCACHE_COMPRESS=true" >> $GITHUB_ENV
          echo "CCACHE_COMPRESSLEVEL=6" >> $GITHUB_ENV
          mkdir -p .ccache

      - name: 恢复 ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-25.12-${{ github.sha }}
          restore-keys: |
            ccache-25.12-

      # ---------------- 构建 ----------------
      - name: 取 aurora 主题源码（放进 package/，不能挂 feed）
        run: |
          set -eu
          # 为什么不能挂成 feed（CI run #5 就是这么挂的，5 分钟就失败了）：
          # OpenWrt 的 feed 扫描器（include/scan.mk）用的是
          #   find -L $(SCAN_DIR) -mindepth 1 -maxdepth $(SCAN_DEPTH) -name Makefile
          # 关键是 -mindepth 1 —— 它【不会】看 feed 仓库根目录下的 Makefile。
          #   openfi6c-packages 能用 → 包在子目录里（luci-app-openfi-fan/Makefile，深度 1）
          #   eamonxg/luci-theme-aurora 不能用 → Makefile 就在仓库根目录（深度 0）
          # 结果：CONFIG_PACKAGE_luci-theme-aurora 变成未知符号，被 make defconfig 丢掉，
          # 后面「应用配置」那步的断言直接把 CI 打红（这正是我们想要的：宁可红，不要静默出错固件）。
          # 正确做法：clone 到 package/ 下当普通包用。
          git clone --depth 1 https://github.com/eamonxg/luci-theme-aurora.git package/luci-theme-aurora
          test -f package/luci-theme-aurora/Makefile || { echo "::error::aurora 源码没取到"; exit 1; }
          echo "----- 包目录内容 -----"
          ls package/luci-theme-aurora/
          # 【别检查 PKG_NAME】它的 Makefile 里根本没有 PKG_NAME ——
          # 只有 LUCI_TITLE / LUCI_DEPENDS / PKG_VERSION，包名由 luci.mk 从【目录名】取
          # （PKG_NAME ?= $(notdir $(CURDIR))）。所以目录名必须是 luci-theme-aurora，
          # 这样 CONFIG_PACKAGE_luci-theme-aurora 才对得上 defconfig。
          # 之前这里写了 grep '^PKG_NAME' 就 exit 1，把好好的构建误杀了（CI run #6）。
          echo "----- 目录名（决定 CONFIG_PACKAGE_ 后面的名字）-----"
          basename package/luci-theme-aurora
          test "$(basename package/luci-theme-aurora)" = "luci-theme-aurora" || { echo "::error::目录名不是 luci-theme-aurora，CONFIG_PACKAGE_luci-theme-aurora 会对不上"; exit 1; }
          echo "----- 它的 Makefile 长这样（确认是 luci.mk 那套）-----"
          grep -E '^(LUCI_TITLE|LUCI_DEPENDS|PKG_VERSION|include)' package/luci-theme-aurora/Makefile || true
          # 换掉 argon 的原因：argon 占 516KB + 6 个字体文件（手机侧约 180KB）；
          # aurora 是 Vite + Tailwind 构建的，移动端适配更好，字体只有 1 个 23KB。

      - name: 加入 openfi6c-packages feed（按开关）
        if: steps.opt.outputs.with_packages == 'true'
        run: |
          set -eu
          echo "src-git openfi6c https://github.com/${{ github.repository_owner }}/openfi6c-packages.git" >> feeds.conf.default
          echo "----- feeds.conf.default -----"
          cat feeds.conf.default

      - name: 更新并安装 feeds
        id: feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          if [ "${{ steps.opt.outputs.with_packages }}" = "true" ]; then
            C=$(git -C feeds/openfi6c rev-parse --short HEAD 2>/dev/null || echo "?")
            echo "pkg_commit=$C" >> "$GITHUB_OUTPUT"
            echo "----- openfi6c feed 实际拉到的提交 -----"
            git -C feeds/openfi6c log -1 --format='%H %ad %s' --date=short 2>/dev/null || true
          else
            echo "pkg_commit=" >> "$GITHUB_OUTPUT"
          fi

      - name: 应用配置
        run: |
          cp defconfig/openfi6c.config .config
          if [ "${{ steps.opt.outputs.with_packages }}" = "true" ]; then
            cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-app-openfi-fan=y
          CONFIG_PACKAGE_luci-app-openfi-sms=y
          CONFIG_PACKAGE_luci-app-openfi-modem=y
          EOF
          fi
          make defconfig
          echo "----- 关键配置确认 -----"
          grep -E 'CONFIG_TARGET_mediatek_filogic_DEVICE_openfi_6c=|CONFIG_PACKAGE_kmod-mt_wifi=|CONFIG_PACKAGE_kmod-warp=|CONFIG_PACKAGE_kmod-mediatek_hnat=|CONFIG_PACKAGE_mtwifi-cfg=' .config || true
          if [ "${{ steps.opt.outputs.with_packages }}" = "true" ]; then
            echo "----- 断言三个 LuCI 包真的被选中 -----"
            for s in luci-app-openfi-fan luci-app-openfi-modem luci-app-openfi-sms; do
              grep -q "^CONFIG_PACKAGE_${s}=y" .config || { echo "::error::${s} 没进 .config（feed 没挂上或包名写错）"; exit 1; }
              echo "OK: ${s}=y"
            done
          fi
          echo "----- 断言 aurora 主题真的被选中 -----"
          grep -q '^CONFIG_PACKAGE_luci-theme-aurora=y' .config || { echo "::error::luci-theme-aurora 没进 .config（package/luci-theme-aurora 没取到，或 make defconfig 把符号丢了）"; exit 1; }
          echo "OK: luci-theme-aurora=y"
          grep -q '^CONFIG_PACKAGE_luci-theme-argon=y' .config && { echo "::error::argon 还在 .config 里（应该已被 aurora 取代）"; exit 1; }
          echo "OK: argon 已移除"
          echo "----- 断言 ccache 真的开了 -----"
          grep -q '^CONFIG_CCACHE=y' .config || { echo "::error::CONFIG_CCACHE 没生效，缓存形同虚设"; exit 1; }
          echo "OK: CONFIG_CCACHE=y"
          echo "----- 断言 initramfs 没被重新打开（否则白编一整套内核+rootfs）-----"
          grep -q '^CONFIG_TARGET_ROOTFS_INITRAMFS=y' .config && { echo "::error::initramfs 又被打开了 —— 我们发版只发布 sysupgrade，不需要它，见 defconfig 里的注释"; exit 1; }
          echo "OK: initramfs 已关闭"
          echo "----- 断言 5G 数据通道驱动都在（切 NCM/ECM 时不至于断网）-----"
          for k in kmod-usb-net-cdc-ncm kmod-usb-net-cdc-ether kmod-usb-net-rndis; do
            grep -q "^CONFIG_PACKAGE_${k}=y" .config || { echo "::error::${k} 没进 .config —— 模组切数据模式时会没有驱动"; exit 1; }
            echo "OK: ${k}=y"
          done

      - name: 下载源码包
        run: |
          make download -j"$(nproc)" || make download -j1 V=s

      - name: 编译
        id: compile
        run: |
          set -o pipefail
          # 【提速】+1 是为了让 CPU 在等 I/O（下载/解包/configure）时不被空着。
          # GitHub 标准 runner 是 4 核 16GB 内存，-j5 不会 OOM。
          time make -j"$(($(nproc) + 1))" 2>&1 | tee /tmp/build.log

      - name: 编译失败诊断
        if: failure() && steps.compile.outcome == 'failure'
        run: |
          echo "===================== 错误行 ====================="
          grep -nE '(Error [0-9]+|error:|ERROR:|undefined reference|No rule to make target|fatal error|Hunk #.*FAILED|patch.*failed)' \
            /tmp/build.log | tail -n 60 || true
          echo ""
          echo "===================== 日志最后 200 行 ====================="
          tail -n 200 /tmp/build.log || true

      - name: ccache 命中统计
        if: always()
        run: |
          staging_dir/host/bin/ccache -s 2>/dev/null || ccache -s 2>/dev/null || echo "（首次构建，ccache 还没生成）"
          du -sh .ccache dl staging_dir 2>/dev/null || true

      - name: 保存 ccache（即使编译失败也存）
        # 【提速关键】默认的 actions/cache 只在 job 成功时才写缓存，
        # 于是编译失败那一轮编的东西全白编了（而失败往往就发生在最后几个包）。
        # 用 restore/save 分开 + if: always()，失败的轮次也能把 ccache 留下来给下次用。
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-25.12-${{ github.sha }}

      - name: 收集产物 + 生成 MD5
        if: success()
        run: |
          set -eu
          mkdir -p out
          FW=$(find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*openfi_6c*sysupgrade.bin' | head -1)
          [ -n "$FW" ] || { echo "::error::没找到 sysupgrade 固件"; ls -la bin/targets/mediatek/filogic/ || true; exit 1; }
          cp "$FW" out/
          B=$(basename "$FW")
          ( cd out && md5sum "$B" > "$B.md5.txt" )
          echo "----- 产物 -----"
          ls -lh out/
          echo "----- MD5 -----"
          cat out/*.md5.txt

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ steps.ver.outputs.tag }}
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传固件
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openfi6c-${{ steps.ver.outputs.tag }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: 创建版本发布（固件 + MD5 两个文件）
        if: success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            TAG="${TAG}-$(git rev-parse --short HEAD)"
          fi
          FWNAME=$(cd out && ls | grep sysupgrade | head -1)
          if [ "${{ steps.opt.outputs.with_packages }}" = "true" ]; then
            PKG_ROW="**已内置** \`luci-app-openfi-fan\` + \`luci-app-openfi-modem\` @ \`${{ steps.feeds.outputs.pkg_commit }}\`"
            FAN_ROW='由 `luci-app-openfi-fan` 管理：四点温度曲线 + 四盏状态灯；物理开关切「静默模式」（风扇停转 + 四灯全灭，含过热保护）'
          else
            PKG_ROW='未内置（可在 Actions 里手动运行本工作流，把 `with_packages` 打开）'
            FAN_ROW='本版**不含**管理（pwm-fan 已 disabled，无人态脚本；按反极性等效全速常转）'
          fi
          cat > /tmp/notes.md <<NOTES
          ## OpenFi 6C 固件 $TAG

          | 项目 | 值 |
          |---|---|
          | 底座 | \`padavanonly/immortalwrt-mt798x-6.6\` @ \`openwrt-24.10-6.6\`（内核 6.6） |
          | WiFi | 联发科闭源 \`mt_wifi\` + WARP + HNAT（HNAT 已绑定 LAN=eth1 / PPD=eth1） |
          | WAN | USB 模组（RNDIS → \`usb0\`）自动成为 WAN，模组自己拨号 |
          | 风扇/LED | $FAN_ROW |
          | LuCI 包 | $PKG_ROW |

          ### 刷机

          \`\`\`sh
          sysupgrade -n /tmp/$FWNAME
          \`\`\`

          - 默认 LAN **\`192.168.6.1\`**（不是原厂的 192.168.21.1，也不是常见的 192.168.1.1）
          - root 无密码；WiFi 默认不加密（首次启动自动生成）
          - 从原厂固件刷入时**不要保留配置**

          ### 附件

          1. \`$FWNAME\` —— 固件本体
          2. \`$FWNAME.md5.txt\` —— 它的 MD5
          NOTES
          gh release create "$TAG" out/* \
            --title "OpenFi 6C $TAG" \
            --notes-file /tmp/notes.md \
            --repo "$GITHUB_REPOSITORY"
          echo "✅ Release: $TAG"
